<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IONOS-8 App</title><style>body{margin:0;background:#070914;color:#eef;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px}.c{background:#12172b;border:1px solid #30365b;border-radius:18px;padding:20px;margin:16px 0}button{background:#7657ff;color:#fff;border:0;border-radius:10px;padding:11px}input{padding:11px;width:70%;background:#080b18;color:#fff;border:1px solid #394060;border-radius:9px}</style>
<style id="chatgpt-inspired-ui">
:root{--ui-accent:#38cfff;--ui-panel:#111521;--ui-bg:#090b12;--ui-line:rgba(255,255,255,.11);--ui-glow:#38cfff33;color-scheme:dark}html{scroll-behavior:smooth}body{background:radial-gradient(ellipse at 50% -10%,var(--ui-glow),transparent 55%),var(--ui-bg);color:#f4f5f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit;border-radius:13px;transition:border-color .18s,box-shadow .18s,transform .18s}input,textarea,select{background:#0c101a;color:#f4f5f7;border:1px solid var(--ui-line);padding:12px 14px}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ui-accent);box-shadow:0 0 0 3px var(--ui-glow)}button{cursor:pointer}button:hover{border-color:var(--ui-accent);box-shadow:0 0 20px var(--ui-glow)}a{color:var(--ui-accent)}[class*=sidebar],aside,nav{backdrop-filter:blur(18px)}[class*=card],[class*=panel]{border-color:var(--ui-line);border-radius:17px}@media(max-width:760px){body{min-height:100dvh}main,.container{max-width:100%;box-sizing:border-box}input,textarea{max-width:100%;box-sizing:border-box}}
</style>
</head><body><main><h1>IONOS-8</h1><p>Standalone IONOS workspace.</p><div class="c"><h2>Control Center</h2><p id="o">Bereit.</p><input id="q" placeholder="Befehl oder Idee…"><button onclick="go()">Ausführen</button></div><div class="c"><h2>System</h2><p>KI · Projektsteuerung · sichere Module · Web-App</p></div></main><script>function go(){let q=document.getElementById('q').value.trim();if(q)document.getElementById('o').textContent='IONOS-8: '+q+' — lokal verarbeitet; externe Aktionen benötigen eine explizite Backend-Anbindung.'}</script></body></html>
