<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IONOS-8 App</title><style>body{margin:0;background:#070914;color:#eef;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px}.c{background:#12172b;border:1px solid #30365b;border-radius:18px;padding:20px;margin:16px 0}button{background:#7657ff;color:#fff;border:0;border-radius:10px;padding:11px}input{padding:11px;width:70%;background:#080b18;color:#fff;border:1px solid #394060;border-radius:9px}</style>
<style id="chatgpt-inspired-ui">
:root{--ui-accent:#38cfff;--ui-panel:#111521;--ui-bg:#090b12;--ui-line:rgba(255,255,255,.11);--ui-glow:#38cfff33;color-scheme:dark}html{scroll-behavior:smooth}body{background:radial-gradient(ellipse at 50% -10%,var(--ui-glow),transparent 55%),var(--ui-bg);color:#f4f5f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit;border-radius:13px;transition:border-color .18s,box-shadow .18s,transform .18s}input,textarea,select{background:#0c101a;color:#f4f5f7;border:1px solid var(--ui-line);padding:12px 14px}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ui-accent);box-shadow:0 0 0 3px var(--ui-glow)}button{cursor:pointer}button:hover{border-color:var(--ui-accent);box-shadow:0 0 20px var(--ui-glow)}a{color:var(--ui-accent)}[class*=sidebar],aside,nav{backdrop-filter:blur(18px)}[class*=card],[class*=panel]{border-color:var(--ui-line);border-radius:17px}@media(max-width:760px){body{min-height:100dvh}main,.container{max-width:100%;box-sizing:border-box}input,textarea{max-width:100%;box-sizing:border-box}}
</style>
<style id="ultima-visual-performance">
:root{--u-cyan:#72e5ef;--u-violet:#8f7cff;--u-line:rgba(160,180,255,.16);color-scheme:dark}
html{scroll-behavior:smooth}body{min-height:100dvh;overflow-x:hidden!important;background:radial-gradient(ellipse at 12% 0%,rgba(89,78,190,.23),transparent 42%),radial-gradient(ellipse at 88% 12%,rgba(39,175,196,.13),transparent 36%),#070914;color:#f5f6ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1080px!important;padding:clamp(18px,4vw,48px)!important}
h1{font-size:clamp(34px,6vw,64px);letter-spacing:-.045em;background:linear-gradient(100deg,#fff,#c8c4ff 58%,#7cebf0);background-clip:text;-webkit-background-clip:text;color:transparent}
.c{background:linear-gradient(145deg,rgba(23,29,53,.86),rgba(12,16,30,.82));border:1px solid var(--u-line);border-radius:22px;padding:clamp(20px,3vw,30px);margin:18px 0;box-shadow:0 18px 55px rgba(0,0,0,.24);backdrop-filter:blur(18px)}
button,input,textarea,select{font:inherit;transition:border-color .18s,box-shadow .18s,transform .18s}
button{border:1px solid rgba(140,124,255,.35);background:linear-gradient(120deg,#8068ee,#3e9cb8);padding:12px 18px;border-radius:12px;color:white;font-weight:700;cursor:pointer}
button:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(110,104,235,.24)}
input{max-width:100%;box-sizing:border-box;border:1px solid var(--u-line);border-radius:12px;padding:12px 14px}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--u-cyan);outline-offset:3px}
@media(max-width:640px){main{padding:14px!important}.c{padding:18px;border-radius:17px}input{width:100%!important;margin-bottom:10px}button{min-height:44px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main><h1>IONOS-8</h1><p>Standalone IONOS workspace.</p><div class="c"><h2>Control Center</h2><p id="o">Bereit.</p><input id="q" placeholder="Befehl oder Idee…"><button onclick="go()">Ausführen</button></div><div class="c"><h2>System</h2><p>KI · Projektsteuerung · sichere Module · Web-App</p></div></main><script>function go(){let q=document.getElementById('q').value.trim();if(q)document.getElementById('o').textContent='IONOS-8: '+q+' — lokal verarbeitet; externe Aktionen benötigen eine explizite Backend-Anbindung.'}</script></body></html>
