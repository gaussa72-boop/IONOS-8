<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IONOS-8 App</title><style>body{margin:0;background:#070914;color:#eef;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px}.c{background:#12172b;border:1px solid #30365b;border-radius:18px;padding:20px;margin:16px 0}button{background:#7657ff;color:#fff;border:0;border-radius:10px;padding:11px}input{padding:11px;width:70%;background:#080b18;color:#fff;border:1px solid #394060;border-radius:9px}</style></head><body><main><h1>IONOS-8</h1><p>Standalone IONOS workspace.</p><div class="c"><h2>Control Center</h2><p id="o">Bereit.</p><input id="q" placeholder="Befehl oder Idee…"><button onclick="go()">Ausführen</button></div><div class="c"><h2>System</h2><p>KI · Projektsteuerung · sichere Module · Web-App</p></div></main><script>function go(){let q=document.getElementById('q').value.trim();if(q)document.getElementById('o').textContent='IONOS-8: '+q+' — lokal verarbeitet; externe Aktionen benötigen eine explizite Backend-Anbindung.'}</script></body></html>
